apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudleak-backend
  namespace: cloudleak
spec:
  
  selector:
    matchLabels:
      app: cloudleak-backend
  template:
    metadata:
      labels:
        app: cloudleak-backend
    spec:
      containers:
        - name: cloudleak-backend
          image: cloudleak-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cloudleak-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
